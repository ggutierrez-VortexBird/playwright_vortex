# Docker Compose — entorno de desarrollo
#
# Monta el volumen playwright-scripts en /app/playwright-scripts para que
# el worker pueda localizar y ejecutar scripts sin configuración adicional.
#
# Uso: docker compose -f docker-compose.dev.yml up

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acta-dev
    ports:
      - "3000:3000"
    environment:
      - PLAYWRIGHT_SCRIPTS_ROOT=/app/playwright-scripts
      - DATABASE_URL=postgresql://acta:acta@postgres:5432/acta?schema=public
    volumes:
      # Volumen nombrado para scripts de Playwright.
      # En desarrollo se puede sustituir por un bind mount si se desea editar
      # scripts desde el host: ./playwright-scripts:/app/playwright-scripts
      - playwright-scripts:/app/playwright-scripts
      # Persistencia de artefactos de ejecución (evidencias, screenshots, traces).
      - artefactos:/app/artefactos
    # El worker corre como proceso dentro del mismo contenedor (long-lived Node).
    # No se usa restart: always en dev para evitar bucles si el build falla.
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  recorder:
    # El recorder-worker comparte imagen con app pero ejecuta el proceso Node
    # dedicado. Aísla memoria/CPU del Chromium y permite escalado independiente.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acta-recorder
    command: ["node", "--import", "tsx", "scripts/recorder-worker.ts"]
    ports:
      - "3100:3100"
    environment:
      - DATABASE_URL=postgresql://acta:acta@postgres:5432/acta?schema=public
      # Apunta al app para HTTP /internal/start (mismo docker network)
      - RECORDER_PUBLIC_URL=ws://localhost:3100
      - RECORDER_WS_PORT=3100
      - RECORDER_INTERNAL_SECRET=${RECORDER_INTERNAL_SECRET:-dev-recorder-secret-change-me-in-prod-32chars}
      - RECORDER_MAX_SESSIONS=${RECORDER_MAX_SESSIONS:-3}
      - RECORDER_HEARTBEAT_TIMEOUT_MS=${RECORDER_HEARTBEAT_TIMEOUT_MS:-600000}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET required}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: acta-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: acta
      POSTGRES_PASSWORD: acta
      POSTGRES_DB: acta
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acta -d acta"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  playwright-scripts:
    driver: local
  artefactos:
    driver: local
  postgres-data:
    driver: local
