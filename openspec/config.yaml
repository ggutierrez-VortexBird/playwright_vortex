# Cambio objetivo: hu0-2-convencion-de-registro-del-script-de-playwright
context: |
  Project: ACTA — internal Vortexbird tool to run existing Playwright tests
  and generate formal evidence reports.
  Stack (planned, not installed): Next.js App Router + TypeScript + Prisma + Postgres.
  Worker: long-lived Node process in the same container (Playwright needs
  persistent process + browser binaries; not serverless).
  Queue: a Postgres `ejecucion` table acts as a simple job queue (no Redis).
  Mode: hybrid (filesystem + Engram).
  Strict TDD: true (test runner pending install at Fase 1 del plan).
  Language: es (specs, docs, commits messages pueden ser en inglés).

# --- Testing capabilities (lo que habrá cuando esté instalado) ---
testing:
  strict_tdd: true
  runner_installed: false
  runner_install_phase: "Fase 1 del plan (esqueleto Next.js) = Fase 7 del pipeline Vorkan / IMPLEMENTER"
  unit: TODO                   # Vitest o Jest — a decidir en Fase 4 DESIGNER
  integration: TODO
  e2e: Playwright              # producto, no test del producto
  linter: TODO                 # ESLint — a confirmar
  formatter: TODO              # Prettier — a confirmar
  type_checker: typescript-strict
  test_command: ""             # se completa cuando se instale el runner
  build_command: ""            # se completa cuando se instale Next.js
  coverage_threshold: 0

# --- Convenciones detectadas ---
conventions:
  language: es
  directory_naming: kebab-case          # convención de nextjs-react-typescript
  typescript: strict
  server_components: default            # 'use client' solo en hojas con justificación
  app_router: required
  pages_router: forbidden
  ui: shadcn/radix/tailwind             # definido en acta-mockups.html
  commit_style: conventional-commits   # visto en commit be001bc
  test_methodology: red-green-refactor
  design_source_of_truth: acta-mockups.html
  design_aesthetic: editorial-documental

# --- Reglas por fase del pipeline Vorkan ---
rules:
  proposal:
    - Incluir plan de rollback para cambios riesgosos
    - Vincular cada propuesta a una HU documentada en documentacion/
  specs:
    - Usar Given/When/Then para escenarios
    - Usar palabras clave RFC 2119 (MUST, SHALL, SHOULD, MAY)
    - Escribir en español
    - Cumplir todos los criterios de aceptación de la HU correspondiente
  design:
    - Documentar decisiones de arquitectura con justificación
    - Cuando la HU toque UI, abrir acta-mockups.html como referencia visual obligatoria
    - Cargar skill de Next.js correspondiente al área de la HU
  tasks:
    - Agrupar por fase, numeración jerárquica
    - Cada tarea debe ser completable en una sesión
    - Marcar dependencias entre tareas explícitamente
  apply:
    - Seguir convenciones de nextjs-react-typescript (kebab-case, named exports, TS estricto)
    - tdd: true
    - test_command: ""             # se completa en Fase 1
    - No crear archivos fuera de la estructura convenida sin justificar
  verify:
    test_command: ""               # se completa en Fase 1
    build_command: ""              # se completa en Fase 1
    coverage_threshold: 0
    - El VERIFIER debe ser adversarial (otro proveedor o ejecución ciega)
  archive:
    - Advertir antes de mergear deltas destructivos
    - Squash-merge de feature/huN-* a develop (un commit limpio por HU)
    - El orquestador no commitea ni mergea sin visto bueno manual del usuario
