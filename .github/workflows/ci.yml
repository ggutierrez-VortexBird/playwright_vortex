name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        proyecto: [vortest-web, vortest-engine]
    defaults:
      run:
        working-directory: ${{ matrix.proyecto }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.proyecto }}/package-lock.json

      - run: npm ci

      - name: Generar cliente de Prisma
        if: matrix.proyecto == 'vortest-web'
        run: npx prisma generate

      # Falla si @playwright/test y el tag del Dockerfile se desalinean
      - name: Verificar alineación de versión de Playwright
        run: npm run verify:playwright

      - run: npm run typecheck

      - run: npm test

      # El lint no bloquea
      - name: Lint (informativo)
        run: npm run lint
        continue-on-error: true
