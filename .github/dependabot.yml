version: 2
updates:
  - package-ecosystem: npm
    directory: /vortest-web
    schedule:
      interval: weekly
    groups:
      minor-y-patch:
        update-types:
          - minor
          - patch
    # Los mayores de estos paquetes se actualizan a mano, de uno en uno
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Versión exacta, acoplada al tag del Dockerfile
      - dependency-name: "@playwright/test"

  - package-ecosystem: npm
    directory: /vortest-engine
    schedule:
      interval: weekly
    groups:
      minor-y-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@playwright/test"

  - package-ecosystem: docker
    directory: /vortest-web
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /vortest-engine
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
