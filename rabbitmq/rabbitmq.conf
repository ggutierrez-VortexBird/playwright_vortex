# definitions.json (exchange/cola de dead-letter `engine.dlx` /
# `engine.execute.dlq`) está DESACTIVADO a
# propósito. No borrarlo todavía: es la topología que hay que declarar.
#
# Por qué no se carga: cuando RabbitMQ importa un definitions.json al arrancar,
# NO crea el usuario por defecto (RABBITMQ_DEFAULT_USER/PASS). Con el import
# activo el broker quedaba sin ningún usuario y web, engine y
# execution-consumer recibían `ACCESS_REFUSED` al conectarse. Meter el usuario
# en definitions.json exigiría dejar un hash de contraseña en un archivo
# versionado; las credenciales vienen solo del entorno.
#
# Estado real hoy: `vortest-engine` declara `engine.execute` con
# `x-dead-letter-exchange: engine.dlx`, pero ese exchange NO existe, así que los
# mensajes muertos se descartan (mismo comportamiento que antes de tener DLQ).
# Pendiente: declarar `engine.dlx` + `engine.execute.dlq` + su binding desde la
# aplicación (assertExchange/assertQueue al conectar) en vez de por archivo.
#
# management.load_definitions = /etc/rabbitmq/definitions.json
